# New HTTPS server block for workmcp (approval step D, 2026-10-27): the VPS had no 443 listener, so this
# is a separate file and the existing port-80 site is not edited except for the ACME include line.
# Install (after certbot has issued the certificate):
#   sudo install -m 644 tools/deploy/nginx-workmcp.conf /etc/nginx/snippets/workmcp.conf
#   sudo install -m 644 tools/deploy/nginx-workmcp-site.conf /etc/nginx/sites-available/workmcp
#   sudo ln -s /etc/nginx/sites-available/workmcp /etc/nginx/sites-enabled/workmcp
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: remove the sites-enabled link, nginx -t, reload.
# The access log has the request line only (no headers, so no bearer token, and no bodies).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name srv1782254.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1782254.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1782254.hstgr.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:workmcp_ssl:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    server_tokens off;

    access_log /var/log/nginx/workmcp.access.log;
    error_log /var/log/nginx/workmcp.error.log;

    include snippets/workmcp.conf;

    location / {
        return 404;
    }
}
