# nginx piece for workmcp (design M5 remote 4.3 option A). Used only when the survey shows that nginx
# already owns port 443. Nothing else in the existing configuration changes.
#
# How to add (approval step D), after the survey tells which `server { }` block answers
# srv1782254.hstgr.cloud on 443:
#   1. sudo install -m 644 tools/deploy/nginx-workmcp.conf /etc/nginx/snippets/workmcp.conf
#      (the part from "location /workmcp/" down is what matters; comments are harmless)
#   2. add ONE line inside that existing server block:   include snippets/workmcp.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx      (do not reload when nginx -t fails)
# Rollback: delete the include line, nginx -t, reload.
#
# The URI is passed unchanged (no trailing slash after the proxy_pass address), so the app sees
# /workmcp/mcp, /workmcp/push/* and /workmcp/healthz exactly as the client sent them.
# Do not log request headers in this location: the Authorization header carries the bearer token
# (nginx's default access log does not include it; keep it that way).

location /workmcp/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 16m;
}

