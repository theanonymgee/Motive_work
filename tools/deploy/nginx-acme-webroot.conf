# Let's Encrypt HTTP-01 webroot for certbot (approval step D, 2026-10-27). Included by ONE line in the
# existing port-80 server block (`include snippets/acme-webroot.conf;`); every other path of that block
# keeps answering as before. Install:
#   sudo install -m 644 tools/deploy/nginx-acme-webroot.conf /etc/nginx/snippets/acme-webroot.conf
#   sudo mkdir -p /var/www/letsencrypt
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}
