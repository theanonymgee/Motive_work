[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "workmcp"
version = "0.1.0"
description = "Personal work-knowledge MCP server: a collector pushes parsed, embedded documents to the operating server, which serves MCP over stdio or HTTPS."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "numpy==2.5.4",
    "olefile==0.47",
    "onnxruntime==1.31.0",
    "pypdf==6.10.0",
    "tokenizers==0.23.3",
]

[project.scripts]
workmcp = "workmcp.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["probe: manual measurement probes (excluded by default)"]
